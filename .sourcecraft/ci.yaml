# SourceCraft CI/CD configuration for the SecureExec Linux agent.
#
# Mirrors .github/workflows/build-linux-agent.yml for the SourceCraft platform.
#
# ─── Required configuration ───────────────────────────────────────────────────
#
# Docker registry: pkg.sourcecraft.tech/cr/org-secureexec/cn1k0rm79abtdt7ijjgv
# (already created and connected to this repository).
#
# Required secret (Repository settings → Secrets):
#   REGISTRY_TOKEN — personal access token with package read/write scope.
#                    Docker login uses the literal username `iam`.
#
# ─── How it works ─────────────────────────────────────────────────────────────
#
# Triggered on every tag push.
#
# 1. The native cubes on the (jammy 22.04) cloud worker handle docker login,
#    image-existence check, and the final docker build & push of agent-files.
#
# 2. A `build-builder-image` cube ensures a noble-based builder image
#    (LLVM 20 + nightly Rust + bpf-linker + dpkg-dev + rpm) exists in the
#    registry under tag $NIGHTLY. It builds & pushes only if missing — once
#    that image is in the registry, every later workflow run reuses it
#    (the cube becomes a ~1 s manifest check).
#
# 3. The cargo build, .deb and .rpm packaging all run inside that builder
#    image (`image:` cubes), giving us the noble runtime + every preinstalled
#    toolchain. This avoids the LLVM 20 / libc6 mismatch on the jammy worker.
#
# 4. Built .deb/.rpm artifacts are exposed as cube artifacts (downloadable
#    from the CI/CD UI for 14 days), and the agent-files Docker image is
#    pushed to the SourceCraft registry so prod hosts can pull with:
#
#      docker pull pkg.sourcecraft.tech/cr/org-secureexec/cn1k0rm79abtdt7ijjgv/agent-files:linux-amd64-<VERSION>

on:
  push:
    - workflows: [build-linux-agent]
      filter:
        tags: ["**"]

workflows:
  build-linux-agent:
    settings:
      max_cube_duration: 60m

    env:
      # Pin nightly to a date that uses LLVM 20 (matches llvm-20-dev from apt).
      # Rust 1.90.0-nightly (2025-07-09), LLVM 20.1.7 — verified working.
      # The builder image is tagged with this exact value, so bumping NIGHTLY
      # automatically triggers a fresh builder rebuild.
      NIGHTLY: nightly-2025-07-10

      # ── SourceCraft Docker registry ──────────────────────────────────────
      # Push targets:
      #   pkg.sourcecraft.tech/cr/org-secureexec/cn1k0rm79abtdt7ijjgv/linux-agent-builder:<NIGHTLY>
      #   pkg.sourcecraft.tech/cr/org-secureexec/cn1k0rm79abtdt7ijjgv/agent-files:linux-amd64-<VERSION>
      REGISTRY: pkg.sourcecraft.tech
      REGISTRY_ORG: org-secureexec
      REGISTRY_ID: cn1k0rm79abtdt7ijjgv
      IMAGE_REPO: agent-files
      BUILDER_IMAGE_REPO: linux-agent-builder

      # Static linking for musl target.
      RUSTFLAGS: "-C link-arg=-static"

    tasks:
      - name: build-linux-agent

        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

        cubes:
          # ── Stage 1: native cubes on the jammy worker ────────────────────

          - name: read-version
            script:
              - VERSION=$(cat linux/agent/version | tr -d '[:space:]')
              - KMOD_VERSION="$VERSION"
              - echo "VERSION=$VERSION" >> $SOURCECRAFT_ENV
              - echo "KMOD_VERSION=$KMOD_VERSION" >> $SOURCECRAFT_ENV
              - echo "DEB_NAME=secureexec-agent_${VERSION}_amd64.deb" >> $SOURCECRAFT_ENV
              - echo "RPM_NAME=secureexec-agent-${VERSION}-1.x86_64.rpm" >> $SOURCECRAFT_ENV
              - echo "KMOD_DEB_NAME=secureexec-kmod_${KMOD_VERSION}_all.deb" >> $SOURCECRAFT_ENV
              - echo "KMOD_RPM_NAME=secureexec-kmod-${KMOD_VERSION}-1.noarch.rpm" >> $SOURCECRAFT_ENV
              - echo "IMAGE=${REGISTRY}/cr/${REGISTRY_ORG}/${REGISTRY_ID}/${IMAGE_REPO}:linux-amd64-${VERSION}" >> $SOURCECRAFT_ENV
              - echo "BUILDER_IMG=${REGISTRY}/cr/${REGISTRY_ORG}/${REGISTRY_ID}/${BUILDER_IMAGE_REPO}:${NIGHTLY}" >> $SOURCECRAFT_ENV

          - name: registry-login
            if: env.REGISTRY_TOKEN != ""
            script:
              - echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username iam --password-stdin

          - name: check-image-exists
            script:
              - |
                if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
                  echo "Image $IMAGE already exists in registry — downstream cubes will self-skip."
                  echo "SKIP=true" >> $SOURCECRAFT_ENV
                else
                  echo "Image $IMAGE not in registry — will build & push."
                  echo "SKIP=false" >> $SOURCECRAFT_ENV
                fi

          - name: build-builder-image
            script:
              - |
                if [ "$SKIP" = "true" ]; then
                  echo "SKIP=true → builder image not needed for this run."
                  exit 0
                fi

                if docker manifest inspect "$BUILDER_IMG" > /dev/null 2>&1; then
                  echo "Builder image $BUILDER_IMG already exists — reusing."
                  exit 0
                fi

                echo "Builder image $BUILDER_IMG missing — building & pushing (one-off, ~10 min)."
                # --provenance=false / --sbom=false: SourceCraft registry
                # (Yandex Container Registry) rejects the OCI image-index
                # manifest format buildx produces by default; these flags
                # force a plain Docker v2 manifest that YCR accepts.
                docker build \
                  --platform linux/amd64 \
                  --provenance=false \
                  --sbom=false \
                  --build-arg NIGHTLY="${NIGHTLY}" \
                  -f docker/linux-agent-builder.Dockerfile \
                  -t "$BUILDER_IMG" \
                  .
                docker push "$BUILDER_IMG"
                echo "Pushed: $BUILDER_IMG"

          # ── Stage 2: cargo build inside the noble builder image ──────────

          - name: build-linux-agent-static-musl
            image:
              name: pkg.sourcecraft.tech/cr/org-secureexec/cn1k0rm79abtdt7ijjgv/linux-agent-builder:nightly-2025-07-10
              username: iam
              password: ${{ secrets.REGISTRY_TOKEN }}
            script:
              - |
                if [ "$SKIP" = "true" ]; then
                  echo "SKIP=true → cube self-skipped (image already in registry)."
                  exit 0
                fi
                cd "$SOURCECRAFT_WORKSPACE"
                cargo build --release --manifest-path Cargo.toml -p secureexec-linux \
                  --target x86_64-unknown-linux-musl
                # Verify it's fully static (ldd prints "statically linked" for static binaries)
                ldd target/x86_64-unknown-linux-musl/release/secureexec-agent-linux 2>&1 \
                  | grep -q "statically linked" \
                  && echo "OK: fully static binary" \
                  || echo "WARNING: binary is not fully static"

          # ── Stage 3: package as .deb / .rpm inside the same builder image ─

          - name: package-agent-deb
            image:
              name: pkg.sourcecraft.tech/cr/org-secureexec/cn1k0rm79abtdt7ijjgv/linux-agent-builder:nightly-2025-07-10
              username: iam
              password: ${{ secrets.REGISTRY_TOKEN }}
            script:
              - |
                if [ "$SKIP" = "true" ]; then
                  echo "SKIP=true → cube self-skipped (image already in registry)."
                  exit 0
                fi
                cd "$SOURCECRAFT_WORKSPACE"

                INSTALL_DIR=/opt/secureexec
                DEB_STAGE=$(mktemp -d)

                mkdir -p "$DEB_STAGE/DEBIAN"
                mkdir -p "$DEB_STAGE${INSTALL_DIR}/bin"
                mkdir -p "$DEB_STAGE/etc/systemd/system"

                cp target/x86_64-unknown-linux-musl/release/secureexec-agent-linux \
                  "$DEB_STAGE${INSTALL_DIR}/bin/secureexec-agent-linux"
                chmod 755 "$DEB_STAGE${INSTALL_DIR}/bin/secureexec-agent-linux"

                cat > "$DEB_STAGE/DEBIAN/control" <<EOF
                Package: secureexec-agent
                Version: ${VERSION}
                Architecture: amd64
                Maintainer: SecureExec <support@secureexec.co>
                Suggests: secureexec-kmod
                Description: SecureExec endpoint agent
                 eBPF-based process, file, and network monitoring agent.
                 Statically linked — no runtime dependencies required.
                 Install secureexec-kmod for optional kmod-based network isolation fallback.
                Priority: optional
                Section: admin
                EOF
                sed -i 's/^                //' "$DEB_STAGE/DEBIAN/control"

                cat > "$DEB_STAGE/etc/systemd/system/secureexec-agent.service" <<EOF
                [Unit]
                Description=SecureExec Agent
                After=network.target

                [Service]
                Type=simple
                ExecStart=${INSTALL_DIR}/bin/secureexec-agent-linux
                WorkingDirectory=${INSTALL_DIR}/var
                Restart=on-failure
                RestartSec=5
                Environment=SecureExec_LOG=info
                AmbientCapabilities=CAP_BPF CAP_PERFMON CAP_SYS_RESOURCE CAP_NET_ADMIN

                [Install]
                WantedBy=multi-user.target
                EOF
                sed -i 's/^                //' "$DEB_STAGE/etc/systemd/system/secureexec-agent.service"

                cat > "$DEB_STAGE/DEBIAN/postinst" <<'EOF'
                #!/bin/sh
                set -e
                mkdir -p /opt/secureexec/var /opt/secureexec/etc
                systemctl daemon-reload
                systemctl enable secureexec-agent.service
                systemctl start secureexec-agent.service || true
                echo "SecureExec agent installed and started."
                EOF
                sed -i 's/^                //' "$DEB_STAGE/DEBIAN/postinst"
                chmod 755 "$DEB_STAGE/DEBIAN/postinst"

                cat > "$DEB_STAGE/DEBIAN/prerm" <<'EOF'
                #!/bin/sh
                set -e
                systemctl stop secureexec-agent.service 2>/dev/null || true
                systemctl disable secureexec-agent.service 2>/dev/null || true
                EOF
                sed -i 's/^                //' "$DEB_STAGE/DEBIAN/prerm"
                chmod 755 "$DEB_STAGE/DEBIAN/prerm"

                dpkg-deb --build "$DEB_STAGE" "$DEB_NAME"
                rm -rf "$DEB_STAGE"
                cp "$DEB_NAME" secureexec-agent.deb
                echo "Built: $DEB_NAME"
            artifacts:
              paths:
                - secureexec-agent.deb

          - name: package-agent-rpm
            image:
              name: pkg.sourcecraft.tech/cr/org-secureexec/cn1k0rm79abtdt7ijjgv/linux-agent-builder:nightly-2025-07-10
              username: iam
              password: ${{ secrets.REGISTRY_TOKEN }}
            script:
              - |
                if [ "$SKIP" = "true" ]; then
                  echo "SKIP=true → cube self-skipped (image already in registry)."
                  exit 0
                fi
                cd "$SOURCECRAFT_WORKSPACE"

                INSTALL_DIR=/opt/secureexec

                mkdir -p ~/rpmbuild/BUILD ~/rpmbuild/RPMS ~/rpmbuild/SOURCES ~/rpmbuild/SPECS ~/rpmbuild/SRPMS
                cp target/x86_64-unknown-linux-musl/release/secureexec-agent-linux ~/rpmbuild/SOURCES/

                UNITDIR=/usr/lib/systemd/system

                cat > ~/rpmbuild/SPECS/secureexec-agent.spec <<EOF
                Name:           secureexec-agent
                Version:        ${VERSION}
                Release:        1
                Summary:        SecureExec endpoint agent
                License:        Proprietary
                BuildArch:      x86_64
                Suggests:       secureexec-kmod

                %description
                eBPF-based process, file, and network monitoring agent.
                Statically linked — no runtime dependencies required.
                Install secureexec-kmod for optional kmod-based network isolation fallback.

                %install
                mkdir -p %{buildroot}${INSTALL_DIR}/bin
                mkdir -p %{buildroot}${UNITDIR}
                install -m 755 %{_sourcedir}/secureexec-agent-linux \\
                  %{buildroot}${INSTALL_DIR}/bin/secureexec-agent-linux
                cat > %{buildroot}${UNITDIR}/secureexec-agent.service <<'SVCEOF'
                [Unit]
                Description=SecureExec Agent
                After=network.target

                [Service]
                Type=simple
                ExecStart=${INSTALL_DIR}/bin/secureexec-agent-linux
                WorkingDirectory=${INSTALL_DIR}/var
                Restart=on-failure
                RestartSec=5
                Environment=SecureExec_LOG=info
                AmbientCapabilities=CAP_BPF CAP_PERFMON CAP_SYS_RESOURCE CAP_NET_ADMIN

                [Install]
                WantedBy=multi-user.target
                SVCEOF

                %files
                ${INSTALL_DIR}/bin/secureexec-agent-linux
                ${UNITDIR}/secureexec-agent.service

                %post
                mkdir -p ${INSTALL_DIR}/var ${INSTALL_DIR}/etc
                systemctl daemon-reload
                systemctl enable secureexec-agent.service || true
                systemctl start secureexec-agent.service || true
                echo "SecureExec agent installed and started."

                %preun
                systemctl stop secureexec-agent.service 2>/dev/null || true
                systemctl disable secureexec-agent.service 2>/dev/null || true
                EOF
                sed -i 's/^                //' ~/rpmbuild/SPECS/secureexec-agent.spec

                rpmbuild -bb ~/rpmbuild/SPECS/secureexec-agent.spec
                cp ~/rpmbuild/RPMS/x86_64/"$RPM_NAME" .
                cp "$RPM_NAME" secureexec-agent.rpm
                echo "Built: $RPM_NAME"
            artifacts:
              paths:
                - secureexec-agent.rpm

          - name: package-kmod-deb
            image:
              name: pkg.sourcecraft.tech/cr/org-secureexec/cn1k0rm79abtdt7ijjgv/linux-agent-builder:nightly-2025-07-10
              username: iam
              password: ${{ secrets.REGISTRY_TOKEN }}
            script:
              - |
                if [ "$SKIP" = "true" ]; then
                  echo "SKIP=true → cube self-skipped (image already in registry)."
                  exit 0
                fi
                cd "$SOURCECRAFT_WORKSPACE"

                DEB_STAGE=$(mktemp -d)

                mkdir -p "$DEB_STAGE/DEBIAN"
                KMOD_SRC="$DEB_STAGE/usr/src/secureexec-kmod-${KMOD_VERSION}"
                mkdir -p "$KMOD_SRC"
                cp linux/kmod/main.c     "$KMOD_SRC/"
                cp linux/kmod/firewall.c "$KMOD_SRC/"
                cp linux/kmod/firewall.h "$KMOD_SRC/"
                cp linux/kmod/compat.h   "$KMOD_SRC/"
                cp linux/kmod/Makefile   "$KMOD_SRC/"
                cp linux/kmod/dkms.conf  "$KMOD_SRC/"
                sed -i "s/0\\.0\\.0-dev/${KMOD_VERSION}/g" "$KMOD_SRC/main.c" "$KMOD_SRC/dkms.conf"

                cat > "$DEB_STAGE/DEBIAN/control" <<EOF
                Package: secureexec-kmod
                Version: ${KMOD_VERSION}
                Architecture: all
                Maintainer: SecureExec <support@secureexec.co>
                Depends: dkms
                Description: SecureExec kernel module — optional kmod-based network isolation
                 Provides the secureexec_kmod netfilter driver for host network isolation.
                 Install alongside secureexec-agent to enable kmod isolation fallback.
                Priority: optional
                Section: kernel
                EOF
                sed -i 's/^                //' "$DEB_STAGE/DEBIAN/control"

                cat > "$DEB_STAGE/DEBIAN/postinst" <<EOF
                #!/bin/sh
                set -e
                KMOD_VER="${KMOD_VERSION}"
                dkms add -m secureexec-kmod -v "\${KMOD_VER}" 2>/dev/null || true
                dkms build -m secureexec-kmod -v "\${KMOD_VER}" || \\
                  echo "WARNING: secureexec_kmod build failed — kmod isolation unavailable"
                dkms install -m secureexec-kmod -v "\${KMOD_VER}" || \\
                  echo "WARNING: secureexec_kmod install failed — kmod isolation unavailable"
                modprobe secureexec_kmod 2>/dev/null || true
                echo "secureexec-kmod installed."
                EOF
                sed -i 's/^                //' "$DEB_STAGE/DEBIAN/postinst"
                chmod 755 "$DEB_STAGE/DEBIAN/postinst"

                cat > "$DEB_STAGE/DEBIAN/prerm" <<EOF
                #!/bin/sh
                set -e
                KMOD_VER="${KMOD_VERSION}"
                rmmod secureexec_kmod 2>/dev/null || true
                dkms remove -m secureexec-kmod -v "\${KMOD_VER}" --all 2>/dev/null || true
                EOF
                sed -i 's/^                //' "$DEB_STAGE/DEBIAN/prerm"
                chmod 755 "$DEB_STAGE/DEBIAN/prerm"

                dpkg-deb --build "$DEB_STAGE" "$KMOD_DEB_NAME"
                rm -rf "$DEB_STAGE"
                cp "$KMOD_DEB_NAME" secureexec-kmod.deb
                echo "Built: $KMOD_DEB_NAME"
            artifacts:
              paths:
                - secureexec-kmod.deb

          - name: package-kmod-rpm
            image:
              name: pkg.sourcecraft.tech/cr/org-secureexec/cn1k0rm79abtdt7ijjgv/linux-agent-builder:nightly-2025-07-10
              username: iam
              password: ${{ secrets.REGISTRY_TOKEN }}
            script:
              - |
                if [ "$SKIP" = "true" ]; then
                  echo "SKIP=true → cube self-skipped (image already in registry)."
                  exit 0
                fi
                cd "$SOURCECRAFT_WORKSPACE"

                mkdir -p ~/rpmbuild/BUILD ~/rpmbuild/RPMS ~/rpmbuild/SOURCES ~/rpmbuild/SPECS ~/rpmbuild/SRPMS
                cp linux/kmod/main.c     ~/rpmbuild/SOURCES/
                cp linux/kmod/firewall.c ~/rpmbuild/SOURCES/
                cp linux/kmod/firewall.h ~/rpmbuild/SOURCES/
                cp linux/kmod/compat.h   ~/rpmbuild/SOURCES/
                cp linux/kmod/Makefile   ~/rpmbuild/SOURCES/
                cp linux/kmod/dkms.conf  ~/rpmbuild/SOURCES/
                sed -i "s/0\\.0\\.0-dev/${KMOD_VERSION}/g" ~/rpmbuild/SOURCES/main.c ~/rpmbuild/SOURCES/dkms.conf

                KMOD_SRC_DIR=/usr/src/secureexec-kmod-${KMOD_VERSION}

                cat > ~/rpmbuild/SPECS/secureexec-kmod.spec <<EOF
                Name:           secureexec-kmod
                Version:        ${KMOD_VERSION}
                Release:        1
                Summary:        SecureExec kernel module — optional kmod-based network isolation
                License:        Proprietary
                BuildArch:      noarch
                Requires:       dkms

                %description
                Provides the secureexec_kmod netfilter driver for host network isolation.
                Install alongside secureexec-agent to enable kmod isolation fallback.

                %install
                mkdir -p %{buildroot}${KMOD_SRC_DIR}
                install -m 644 %{_sourcedir}/main.c     %{buildroot}${KMOD_SRC_DIR}/
                install -m 644 %{_sourcedir}/firewall.c %{buildroot}${KMOD_SRC_DIR}/
                install -m 644 %{_sourcedir}/firewall.h %{buildroot}${KMOD_SRC_DIR}/
                install -m 644 %{_sourcedir}/compat.h   %{buildroot}${KMOD_SRC_DIR}/
                install -m 644 %{_sourcedir}/Makefile   %{buildroot}${KMOD_SRC_DIR}/
                install -m 644 %{_sourcedir}/dkms.conf  %{buildroot}${KMOD_SRC_DIR}/

                %files
                ${KMOD_SRC_DIR}/

                %post
                KMOD_VER="${KMOD_VERSION}"
                dkms add -m secureexec-kmod -v "\${KMOD_VER}" 2>/dev/null || true
                dkms build -m secureexec-kmod -v "\${KMOD_VER}" || echo "WARNING: secureexec_kmod build failed"
                dkms install -m secureexec-kmod -v "\${KMOD_VER}" || echo "WARNING: secureexec_kmod install failed"
                modprobe secureexec_kmod 2>/dev/null || true

                %preun
                KMOD_VER="${KMOD_VERSION}"
                rmmod secureexec_kmod 2>/dev/null || true
                dkms remove -m secureexec-kmod -v "\${KMOD_VER}" --all 2>/dev/null || true
                EOF
                sed -i 's/^                //' ~/rpmbuild/SPECS/secureexec-kmod.spec

                rpmbuild -bb ~/rpmbuild/SPECS/secureexec-kmod.spec
                cp ~/rpmbuild/RPMS/noarch/"$KMOD_RPM_NAME" .
                cp "$KMOD_RPM_NAME" secureexec-kmod.rpm
                echo "Built: $KMOD_RPM_NAME"
            artifacts:
              paths:
                - secureexec-kmod.rpm

          # ── Stage 4: build & push agent-files Docker image (native) ──────
          # Pushed to pkg.sourcecraft.tech so prod hosts can pull from
          #   pkg.sourcecraft.tech/cr/org-secureexec/cn1k0rm79abtdt7ijjgv/agent-files:linux-amd64-${VERSION}

          - name: build-and-push-agent-files-image
            if: env.REGISTRY_TOKEN != ""
            script:
              - |
                if [ "$SKIP" = "true" ]; then
                  echo "SKIP=true → cube self-skipped (image already in registry)."
                  exit 0
                fi

                # Collect all linux/amd64 packages into pkg/ with versioned canonical names.
                # The Dockerfile CMD will create versionless symlinks at runtime.
                mkdir -p pkg
                cp "$DEB_NAME" pkg/secureexec-agent_linux_amd64_${VERSION}.deb
                cp "$RPM_NAME" pkg/secureexec-agent_linux_amd64_${VERSION}.rpm
                cp "$KMOD_DEB_NAME" pkg/secureexec-kmod_linux_all_${KMOD_VERSION}.deb
                cp "$KMOD_RPM_NAME" pkg/secureexec-kmod_linux_noarch_${KMOD_VERSION}.rpm

                # --provenance=false / --sbom=false: required for the
                # SourceCraft (Yandex Container) registry, which rejects
                # buildx's default OCI image-index manifest.
                docker build \
                  --provenance=false \
                  --sbom=false \
                  -f docker/agent-files.Dockerfile \
                  --build-arg VERSION="${VERSION}" \
                  -t "$IMAGE" \
                  .

                docker push "$IMAGE"
                echo "Pushed: $IMAGE"
